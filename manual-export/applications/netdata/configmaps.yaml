        {"apiVersion":"v1","data":{"metrics.html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eCatDevOps.net - Live Cluster Metrics\u003c/title\u003e\n    \u003clink href=\"https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css\" rel=\"stylesheet\"\u003e\n    \u003clink href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css\" rel=\"stylesheet\"\u003e\n    \u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\"\u003e\n    \u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin\u003e\n    \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700\u0026display=swap\" rel=\"stylesheet\"\u003e\n    \u003cstyle\u003e\n        body {\n            font-family: 'Inter', sans-serif;\n        }\n        .gradient-bg {\n            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n        }\n        .metric-card {\n            transition: all 0.3s ease;\n        }\n        .metric-card:hover {\n            transform: translateY(-3px);\n            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);\n        }\n        .animate-pulse-slow {\n            animation: pulse 3s infinite;\n        }\n        .status-indicator {\n            display: inline-block;\n            width: 12px;\n            height: 12px;\n            border-radius: 50%;\n            margin-right: 8px;\n        }\n        .status-online {\n            background: #10b981;\n            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);\n        }\n        .status-offline {\n            background: #ef4444;\n            box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);\n        }\n        .debug-info {\n            background-color: rgba(0, 0, 0, 0.3);\n            border: 1px solid #4a5568;\n            border-radius: 8px;\n            padding: 12px;\n            margin-top: 16px;\n            font-family: 'Courier New', monospace;\n            font-size: 0.75rem;\n            color: #e2e8f0;\n        }\n    \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody class=\"bg-gray-900 text-white min-h-screen\"\u003e\n    \u003c!-- Header --\u003e\n    \u003cheader class=\"gradient-bg shadow-2xl\"\u003e\n        \u003cdiv class=\"container mx-auto px-6 py-8\"\u003e\n            \u003cdiv class=\"flex items-center justify-between flex-wrap\"\u003e\n                \u003cdiv class=\"flex items-center space-x-4\"\u003e\n                    \u003cdiv class=\"text-3xl md:text-4xl font-extrabold text-white animate-pulse-slow\"\u003e\n                        \u003ci class=\"fas fa-chart-line mr-2\"\u003e\u003c/i\u003e\n                        CatDevOps.net\n                    \u003c/div\u003e\n                    \u003cspan class=\"hidden md:inline-block text-sm text-gray-200\"\u003eLive Cluster Metrics\u003c/span\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"flex items-center space-x-4\"\u003e\n                    \u003cspan id=\"current-time\" class=\"text-sm md:text-base font-medium text-gray-200\"\u003e\u003c/span\u003e\n                    \u003cspan class=\"text-lg md:text-xl font-bold text-gray-200\"\u003e\n                        \u003cspan id=\"total-nodes-header\"\u003e0\u003c/span\u003e/3 Nodes Online\n                    \u003c/span\u003e\n                    \u003ca href=\"https://catdevops.net\" class=\"text-gray-200 hover:text-white transition-colors\"\u003e\n                        \u003ci class=\"fas fa-home text-xl\"\u003e\u003c/i\u003e\n                    \u003c/a\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/header\u003e\n\n    \u003c!-- Main Content --\u003e\n    \u003cmain class=\"container mx-auto px-6 py-12\"\u003e\n        \u003cdiv class=\"text-center mb-12\"\u003e\n            \u003ch1 class=\"text-4xl md:text-5xl font-bold mb-4\"\u003e\n                Real-Time Cluster Metrics\n            \u003c/h1\u003e\n            \u003cp class=\"text-gray-400 text-lg\"\u003e\n                Live monitoring of bare-metal Kubernetes cluster performance\n            \u003c/p\u003e\n        \u003c/div\u003e\n\n        \u003c!-- Cluster Overview --\u003e\n        \u003cdiv class=\"bg-gradient-to-r from-gray-800 to-gray-900 rounded-lg p-8 mb-12 shadow-xl\"\u003e\n            \u003cdiv class=\"text-center mb-6\"\u003e\n                \u003ch2 class=\"text-2xl md:text-3xl font-bold text-white mb-4\"\u003eCluster Overview\u003c/h2\u003e\n            \u003c/div\u003e\n            \u003cdiv class=\"grid grid-cols-1 md:grid-cols-4 gap-6\"\u003e\n                \u003cdiv class=\"metric-card bg-gray-800 rounded-lg p-6 shadow-xl flex flex-col items-center text-center\"\u003e\n                    \u003cdiv class=\"text-4xl text-green-400 mb-4\"\u003e\n                        \u003ci class=\"fas fa-server\"\u003e\u003c/i\u003e\n                    \u003c/div\u003e\n                    \u003cdiv class=\"text-xl font-bold text-gray-300 mb-2\"\u003eNodes Online\u003c/div\u003e\n                    \u003cdiv id=\"total-nodes\" class=\"text-4xl font-extrabold text-green-300\"\u003e0/3\u003c/div\u003e\n                    \u003cdiv class=\"text-gray-400\"\u003eActive\u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"metric-card bg-gray-800 rounded-lg p-6 shadow-xl flex flex-col items-center text-center\"\u003e\n                    \u003cdiv class=\"text-4xl text-purple-400 mb-4\"\u003e\n                        \u003ci class=\"fas fa-microchip\"\u003e\u003c/i\u003e\n                    \u003c/div\u003e\n                    \u003cdiv class=\"text-xl font-bold text-gray-300 mb-2\"\u003eAvg CPU\u003c/div\u003e\n                    \u003cdiv id=\"cluster-cpu\" class=\"text-4xl font-extrabold text-purple-300\"\u003e--%\u003c/div\u003e\n                    \u003cdiv class=\"text-gray-400\"\u003eUsage\u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"metric-card bg-gray-800 rounded-lg p-6 shadow-xl flex flex-col items-center text-center\"\u003e\n                    \u003cdiv class=\"text-4xl text-blue-400 mb-4\"\u003e\n                        \u003ci class=\"fas fa-memory\"\u003e\u003c/i\u003e\n                    \u003c/div\u003e\n                    \u003cdiv class=\"text-xl font-bold text-gray-300 mb-2\"\u003eAvg Memory\u003c/div\u003e\n                    \u003cdiv id=\"cluster-memory\" class=\"text-4xl font-extrabold text-blue-300\"\u003e--%\u003c/div\u003e\n                    \u003cdiv class=\"text-gray-400\"\u003eUsage\u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"metric-card bg-gray-800 rounded-lg p-6 shadow-xl flex flex-col items-center text-center\"\u003e\n                    \u003cdiv class=\"text-4xl text-orange-400 mb-4\"\u003e\n                        \u003ci class=\"fas fa-tachometer-alt\"\u003e\u003c/i\u003e\n                    \u003c/div\u003e\n                    \u003cdiv class=\"text-xl font-bold text-gray-300 mb-2\"\u003eAvg Load\u003c/div\u003e\n                    \u003cdiv id=\"cluster-load\" class=\"text-4xl font-extrabold text-orange-300\"\u003e--\u003c/div\u003e\n                    \u003cdiv class=\"text-gray-400\"\u003e1min\u003c/div\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003c!-- Master Node --\u003e\n        \u003cdiv class=\"bg-gradient-to-r from-purple-800 to-purple-900 rounded-lg p-8 mb-8 shadow-xl\"\u003e\n            \u003ch2 class=\"text-2xl md:text-3xl font-bold text-white mb-6 text-center\"\u003e\n                \u003cspan class=\"status-indicator\" id=\"master-status\"\u003e\u003c/span\u003e\n                Master Node (Control Plane)\n            \u003c/h2\u003e\n            \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6\"\u003e\n                \u003cdiv class=\"metric-card bg-gray-800 rounded-lg p-6 shadow-xl\"\u003e\n                    \u003cdiv class=\"flex items-center mb-4\"\u003e\n                        \u003ci class=\"fas fa-microchip text-2xl text-green-400 mr-3\"\u003e\u003c/i\u003e\n                        \u003cdiv class=\"text-lg font-bold text-gray-300\"\u003eCPU Usage\u003c/div\u003e\n                    \u003c/div\u003e\n                    \u003cdiv id=\"master-cpu-value\" class=\"text-3xl font-extrabold text-green-300 mb-2\"\u003e--\u003c/div\u003e\n                    \u003cdiv id=\"master-cpu-detail\" class=\"text-sm text-gray-400\"\u003eLoading...\u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"metric-card bg-gray-800 rounded-lg p-6 shadow-xl\"\u003e\n                    \u003cdiv class=\"flex items-center mb-4\"\u003e\n                        \u003ci class=\"fas fa-memory text-2xl text-blue-400 mr-3\"\u003e\u003c/i\u003e\n                        \u003cdiv class=\"text-lg font-bold text-gray-300\"\u003eMemory\u003c/div\u003e\n                    \u003c/div\u003e\n                    \u003cdiv id=\"master-memory-value\" class=\"text-3xl font-extrabold text-blue-300 mb-2\"\u003e--\u003c/div\u003e\n                    \u003cdiv id=\"master-memory-detail\" class=\"text-sm text-gray-400\"\u003eLoading...\u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"metric-card bg-gray-800 rounded-lg p-6 shadow-xl\"\u003e\n                    \u003cdiv class=\"flex items-center mb-4\"\u003e\n                        \u003ci class=\"fas fa-tachometer-alt text-2xl text-orange-400 mr-3\"\u003e\u003c/i\u003e\n                        \u003cdiv class=\"text-lg font-bold text-gray-300\"\u003eLoad Avg\u003c/div\u003e\n                    \u003c/div\u003e\n                    \u003cdiv id=\"master-load-value\" class=\"text-3xl font-extrabold text-orange-300 mb-2\"\u003e--\u003c/div\u003e\n                    \u003cdiv id=\"master-load-detail\" class=\"text-sm text-gray-400\"\u003e1m, 5m, 15m\u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"metric-card bg-gray-800 rounded-lg p-6 shadow-xl\"\u003e\n                    \u003cdiv class=\"flex items-center mb-4\"\u003e\n                        \u003ci class=\"fas fa-clock text-2xl text-purple-400 mr-3\"\u003e\u003c/i\u003e\n                        \u003cdiv class=\"text-lg font-bold text-gray-300\"\u003eUptime\u003c/div\u003e\n                    \u003c/div\u003e\n                    \u003cdiv id=\"master-uptime-value\" class=\"text-3xl font-extrabold text-purple-300 mb-2\"\u003e--\u003c/div\u003e\n                    \u003cdiv id=\"master-uptime-detail\" class=\"text-sm text-gray-400\"\u003eLoading...\u003c/div\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003c!-- Worker Node 1 --\u003e\n        \u003cdiv class=\"bg-gradient-to-r from-blue-800 to-blue-900 rounded-lg p-8 mb-8 shadow-xl\"\u003e\n            \u003ch2 class=\"text-2xl md:text-3xl font-bold text-white mb-6 text-center\"\u003e\n                \u003cspan class=\"status-indicator\" id=\"worker1-status\"\u003e\u003c/span\u003e\n                Worker Node 1 (node01.local)\n            \u003c/h2\u003e\n            \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6\"\u003e\n                \u003cdiv class=\"metric-card bg-gray-800 rounded-lg p-6 shadow-xl\"\u003e\n                    \u003cdiv class=\"flex items-center mb-4\"\u003e\n                        \u003ci class=\"fas fa-microchip text-2xl text-green-400 mr-3\"\u003e\u003c/i\u003e\n                        \u003cdiv class=\"text-lg font-bold text-gray-300\"\u003eCPU Usage\u003c/div\u003e\n                    \u003c/div\u003e\n                    \u003cdiv id=\"worker1-cpu-value\" class=\"text-3xl font-extrabold text-green-300 mb-2\"\u003e--\u003c/div\u003e\n                    \u003cdiv id=\"worker1-cpu-detail\" class=\"text-sm text-gray-400\"\u003eLoading...\u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"metric-card bg-gray-800 rounded-lg p-6 shadow-xl\"\u003e\n                    \u003cdiv class=\"flex items-center mb-4\"\u003e\n                        \u003ci class=\"fas fa-memory text-2xl text-blue-400 mr-3\"\u003e\u003c/i\u003e\n                        \u003cdiv class=\"text-lg font-bold text-gray-300\"\u003eMemory\u003c/div\u003e\n                    \u003c/div\u003e\n                    \u003cdiv id=\"worker1-memory-value\" class=\"text-3xl font-extrabold text-blue-300 mb-2\"\u003e--\u003c/div\u003e\n                    \u003cdiv id=\"worker1-memory-detail\" class=\"text-sm text-gray-400\"\u003eLoading...\u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"metric-card bg-gray-800 rounded-lg p-6 shadow-xl\"\u003e\n                    \u003cdiv class=\"flex items-center mb-4\"\u003e\n                        \u003ci class=\"fas fa-tachometer-alt text-2xl text-orange-400 mr-3\"\u003e\u003c/i\u003e\n                        \u003cdiv class=\"text-lg font-bold text-gray-300\"\u003eLoad Avg\u003c/div\u003e\n                    \u003c/div\u003e\n                    \u003cdiv id=\"worker1-load-value\" class=\"text-3xl font-extrabold text-orange-300 mb-2\"\u003e--\u003c/div\u003e\n                    \u003cdiv id=\"worker1-load-detail\" class=\"text-sm text-gray-400\"\u003e1m, 5m, 15m\u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"metric-card bg-gray-800 rounded-lg p-6 shadow-xl\"\u003e\n                    \u003cdiv class=\"flex items-center mb-4\"\u003e\n                        \u003ci class=\"fas fa-clock text-2xl text-purple-400 mr-3\"\u003e\u003c/i\u003e\n                        \u003cdiv class=\"text-lg font-bold text-gray-300\"\u003eUptime\u003c/div\u003e\n                    \u003c/div\u003e\n                    \u003cdiv id=\"worker1-uptime-value\" class=\"text-3xl font-extrabold text-purple-300 mb-2\"\u003e--\u003c/div\u003e\n                    \u003cdiv id=\"worker1-uptime-detail\" class=\"text-sm text-gray-400\"\u003eLoading...\u003c/div\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003c!-- Worker Node 2 --\u003e\n        \u003cdiv class=\"bg-gradient-to-r from-green-800 to-green-900 rounded-lg p-8 mb-8 shadow-xl\"\u003e\n            \u003ch2 class=\"text-2xl md:text-3xl font-bold text-white mb-6 text-center\"\u003e\n                \u003cspan class=\"status-indicator\" id=\"worker2-status\"\u003e\u003c/span\u003e\n                Worker Node 2 (node02)\n            \u003c/h2\u003e\n            \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6\"\u003e\n                \u003cdiv class=\"metric-card bg-gray-800 rounded-lg p-6 shadow-xl\"\u003e\n                    \u003cdiv class=\"flex items-center mb-4\"\u003e\n                        \u003ci class=\"fas fa-microchip text-2xl text-green-400 mr-3\"\u003e\u003c/i\u003e\n                        \u003cdiv class=\"text-lg font-bold text-gray-300\"\u003eCPU Usage\u003c/div\u003e\n                    \u003c/div\u003e\n                    \u003cdiv id=\"worker2-cpu-value\" class=\"text-3xl font-extrabold text-green-300 mb-2\"\u003e--\u003c/div\u003e\n                    \u003cdiv id=\"worker2-cpu-detail\" class=\"text-sm text-gray-400\"\u003eLoading...\u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"metric-card bg-gray-800 rounded-lg p-6 shadow-xl\"\u003e\n                    \u003cdiv class=\"flex items-center mb-4\"\u003e\n                        \u003ci class=\"fas fa-memory text-2xl text-blue-400 mr-3\"\u003e\u003c/i\u003e\n                        \u003cdiv class=\"text-lg font-bold text-gray-300\"\u003eMemory\u003c/div\u003e\n                    \u003c/div\u003e\n                    \u003cdiv id=\"worker2-memory-value\" class=\"text-3xl font-extrabold text-blue-300 mb-2\"\u003e--\u003c/div\u003e\n                    \u003cdiv id=\"worker2-memory-detail\" class=\"text-sm text-gray-400\"\u003eLoading...\u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"metric-card bg-gray-8 rounded-lg p-6 shadow-xl\"\u003e\n                    \u003cdiv class=\"flex items-center mb-4\"\u003e\n                        \u003ci class=\"fas fa-tachometer-alt text-2xl text-orange-400 mr-3\"\u003e\u003c/i\u003e\n                        \u003cdiv class=\"text-lg font-bold text-gray-300\"\u003eLoad Avg\u003c/div\u003e\n                    \u003c/div\u003e\n                    \u003cdiv id=\"worker2-load-value\" class=\"text-3xl font-extrabold text-orange-300 mb-2\"\u003e--\u003c/div\u003e\n                    \u003cdiv id=\"worker2-load-detail\" class=\"text-sm text-gray-400\"\u003e1m, 5m, 15m\u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"metric-card bg-gray-800 rounded-lg p-6 shadow-xl\"\u003e\n                    \u003cdiv class=\"flex items-center mb-4\"\u003e\n                        \u003ci class=\"fas fa-clock text-2xl text-purple-400 mr-3\"\u003e\u003c/i\u003e\n                        \u003cdiv class=\"text-lg font-bold text-gray-300\"\u003eUptime\u003c/div\u003e\n                    \u003c/div\u003e\n                    \u003cdiv id=\"worker2-uptime-value\" class=\"text-3xl font-extrabold text-purple-300 mb-2\"\u003e--\u003c/div\u003e\n                    \u003cdiv id=\"worker2-uptime-detail\" class=\"text-sm text-gray-400\"\u003eLoading...\u003c/div\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003c!-- Status Section --\u003e\n        \u003cdiv class=\"text-center space-y-4\"\u003e\n            \u003cdiv class=\"bg-gradient-to-r from-gray-800 to-gray-900 rounded-lg p-6 shadow-xl\"\u003e\n                \u003cdiv class=\"text-lg font-semibold text-white mb-2\"\u003e\n                    \u003ci class=\"fas fa-sync-alt mr-2\"\u003e\u003c/i\u003e\n                    Auto-refreshing every 5 seconds\n                \u003c/div\u003e\n                \u003cdiv class=\"text-gray-400\"\u003e\n                    Last update: \u003cspan id=\"last-update\" class=\"text-blue-300 font-mono\"\u003eNever\u003c/span\u003e\n                \u003c/div\u003e\n            \u003c/div\u003e\n            \u003cdiv class=\"debug-info\" id=\"debug-info\"\u003eDebug: Ready\u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/main\u003e\n\n    \u003c!-- Footer --\u003e\n    \u003cfooter class=\"bg-gray-800 border-t border-gray-700 py-8 mt-12\"\u003e\n        \u003cdiv class=\"container mx-auto px-6\"\u003e\n            \u003cdiv class=\"text-center\"\u003e\n                \u003cdiv class=\"flex justify-center space-x-8 mb-4\"\u003e\n                    \u003ca href=\"https://catdevops.net\" class=\"text-blue-400 hover:text-blue-300 transition-colors\"\u003e\n                        \u003ci class=\"fas fa-home mr-2\"\u003e\u003c/i\u003eHome\n                    \u003c/a\u003e\n                    \u003ca href=\"https://github.com/catdevops1/k8s-baremetal-dashboard\" target=\"_blank\" class=\"text-gray-400 hover:text-gray-300 transition-colors\"\u003e\n                        \u003ci class=\"fab fa-github mr-2\"\u003e\u003c/i\u003eGitHub\n                    \u003c/a\u003e\n                    \u003ca href=\"https://linkedin.com/in/catalin-bot\" target=\"_blank\" class=\"text-blue-400 hover:text-blue-300 transition-colors\"\u003e\n                        \u003ci class=\"fab fa-linkedin mr-2\"\u003e\u003c/i\u003eLinkedIn\n                    \u003c/a\u003e\n                \u003c/div\u003e\n                \u003cp class=\"text-gray-400 text-sm\"\u003e\n                    \u0026copy; 2025 Catalin Bot | Real-time Kubernetes monitoring on bare-metal infrastructure\n                \u003c/p\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/footer\u003e\n\n    \u003cscript\u003e\n        const API_BASE_URL = window.location.origin;\n        const REFRESH_INTERVAL = 5000;\n        \n        // Store node data for cluster averages\n        let nodeMetrics = {\n            master: { cpu: 0, memory: 0, load: 0, online: false },\n            worker1: { cpu: 0, memory: 0, load: 0, online: false },\n            worker2: { cpu: 0, memory: 0, load: 0, online: false }\n        };\n\n        function debugLog(message) {\n            console.log(message);\n            document.getElementById('debug-info').textContent = `Debug: ${message}`;\n        }\n\n        function updateCurrentTime() {\n            const now = new Date();\n            const timeString = now.toLocaleTimeString();\n            document.getElementById('current-time').textContent = timeString;\n        }\n\n        async function fetchNodeMetrics(node, nodeKey) {\n            try {\n                debugLog(`Fetching ${node} metrics...`);\n                \n                // Use headers for cache-busting instead of URL parameters\n                const requestId = Math.random().toString(36).substring(7);\n                const headers = {\n                    'Cache-Control': 'no-cache, no-store, must-revalidate',\n                    'Pragma': 'no-cache',\n                    'Expires': '0',\n                    'X-Request-ID': requestId,\n                    'X-Timestamp': Date.now().toString()\n                };\n                \n                // Fetch metrics for specific node without query parameters  \n                const [cpuRes, memRes, loadRes, uptimeRes] = await Promise.all([\n                    fetch(`${API_BASE_URL}/node/${nodeKey}/cpu`, {\n                        method: 'GET',\n                        cache: 'no-store',\n                        headers: headers\n                    }),\n                    fetch(`${API_BASE_URL}/node/${nodeKey}/memory`, {\n                        method: 'GET', \n                        cache: 'no-store',\n                        headers: headers\n                    }),\n                    fetch(`${API_BASE_URL}/node/${nodeKey}/load`, {\n                        method: 'GET',\n                        cache: 'no-store', \n                        headers: headers\n                    }),\n                    fetch(`${API_BASE_URL}/node/${nodeKey}/uptime`, {\n                        method: 'GET',\n                        cache: 'no-store',\n                        headers: headers\n                    })\n                ]);\n\n                // Check if responses are OK and log status\n                debugLog(`${node} responses: CPU=${cpuRes.status}, MEM=${memRes.status}, LOAD=${loadRes.status}, UP=${uptimeRes.status}`);\n                \n                if (!cpuRes.ok || !memRes.ok || !loadRes.ok || !uptimeRes.ok) {\n                    throw new Error(`HTTP Error: CPU=${cpuRes.status}, MEM=${memRes.status}, LOAD=${loadRes.status}, UP=${uptimeRes.status}`);\n                }\n\n                // Get response text first to debug what we're receiving\n                const cpuText = await cpuRes.text();\n                const memText = await memRes.text();\n                const loadText = await loadRes.text();\n                const uptimeText = await uptimeRes.text();\n\n                // Check if response looks like JSON\n                if (!cpuText.startsWith('{') \u0026\u0026 !cpuText.startsWith('[')) {\n                    debugLog(`${node} Error: Expected JSON but got: ${cpuText.substring(0, 100)}`);\n                    throw new Error(`Invalid JSON response: ${cpuText.substring(0, 100)}`);\n                }\n\n                // Parse JSON\n                const cpuData = JSON.parse(cpuText);\n                const memData = JSON.parse(memText);\n                const loadData = JSON.parse(loadText);\n                const uptimeData = JSON.parse(uptimeText);\n\n                // Update status indicator\n                document.getElementById(`${node}-status`).className = 'status-indicator status-online';\n                nodeMetrics[node].online = true;\n\n                // CPU metrics\n                if (cpuData.data \u0026\u0026 cpuData.data[0]) {\n                    const row = cpuData.data[0];\n                    const user = row[6] || 0;\n                    const system = row[7] || 0;\n                    const nice = row[8] || 0;\n                    const iowait = row[9] || 0;\n                    const totalUsage = user + system + nice + iowait;\n                    \n                    nodeMetrics[node].cpu = totalUsage;\n                    document.getElementById(`${node}-cpu-value`).textContent = `${totalUsage.toFixed(1)}%`;\n                    document.getElementById(`${node}-cpu-detail`).textContent =\n                        `User: ${user.toFixed(1)}%, Sys: ${system.toFixed(1)}%, IO: ${iowait.toFixed(1)}%`;\n                }\n\n                // Memory metrics\n                if (memData.data \u0026\u0026 memData.data[0]) {\n                    const used = memData.data[0][1] || 0;\n                    const free = memData.data[0][2] || 0;\n                    const total = used + free;\n                    const usagePercent = ((used / total) * 100);\n                    \n                    nodeMetrics[node].memory = usagePercent;\n                    document.getElementById(`${node}-memory-value`).textContent = `${usagePercent.toFixed(1)}%`;\n                    document.getElementById(`${node}-memory-detail`).textContent = \n                        `${(used/1024).toFixed(1)} GB / ${(total/1024).toFixed(1)} GB`;\n                }\n\n                // Load metrics\n                if (loadData.data \u0026\u0026 loadData.data[0]) {\n                    const load1 = loadData.data[0][1] || 0;\n                    const load5 = loadData.data[0][2] || 0;\n                    const load15 = loadData.data[0][3] || 0;\n                    \n                    nodeMetrics[node].load = load1;\n                    document.getElementById(`${node}-load-value`).textContent = load1.toFixed(2);\n                    document.getElementById(`${node}-load-detail`).textContent = \n                        `${load1.toFixed(2)}, ${load5.toFixed(2)}, ${load15.toFixed(2)}`;\n                }\n\n                // Uptime metrics\n                if (uptimeData.data \u0026\u0026 uptimeData.data[0]) {\n                    const seconds = uptimeData.data[0][1] || 0;\n                    const days = Math.floor(seconds / 86400);\n                    const hours = Math.floor((seconds % 86400) / 3600);\n                    const minutes = Math.floor((seconds % 3600) / 60);\n                    \n                    document.getElementById(`${node}-uptime-value`).textContent = `${days}d ${hours}h`;\n                    document.getElementById(`${node}-uptime-detail`).textContent = \n                        `${days} days, ${hours} hours, ${minutes} minutes`;\n                }\n\n                debugLog(`${node} metrics updated successfully`);\n\n            } catch (err) {\n                console.error(`Error fetching ${node} metrics:`, err);\n                debugLog(`${node} Error: ${err.message}`);\n                \n                document.getElementById(`${node}-status`).className = 'status-indicator status-offline';\n                nodeMetrics[node].online = false;\n                \n                // Show error state\n                document.getElementById(`${node}-cpu-value`).innerHTML = '\u003cspan class=\"text-red-400\"\u003eError\u003c/span\u003e';\n                document.getElementById(`${node}-memory-value`).innerHTML = '\u003cspan class=\"text-red-400\"\u003eError\u003c/span\u003e';\n                document.getElementById(`${node}-load-value`).innerHTML = '\u003cspan class=\"text-red-400\"\u003eError\u003c/span\u003e';\n            }\n        }\n\n        function updateClusterOverview() {\n            const onlineNodes = Object.values(nodeMetrics).filter(n =\u003e n.online);\n            const nodeCount = onlineNodes.length;\n            \n            if (nodeCount \u003e 0) {\n                const avgCpu = onlineNodes.reduce((sum, n) =\u003e sum + n.cpu, 0) / nodeCount;\n                const avgMemory = onlineNodes.reduce((sum, n) =\u003e sum + n.memory, 0) / nodeCount;\n                const avgLoad = onlineNodes.reduce((sum, n) =\u003e sum + n.load, 0) / nodeCount;\n                \n                document.getElementById('cluster-cpu').textContent = `${avgCpu.toFixed(1)}%`;\n                document.getElementById('cluster-memory').textContent = `${avgMemory.toFixed(1)}%`;\n                document.getElementById('cluster-load').textContent = avgLoad.toFixed(2);\n            }\n            \n            document.getElementById('total-nodes').textContent = `${nodeCount}/3`;\n            document.getElementById('total-nodes-header').textContent = nodeCount;\n        }\n\n        async function fetchAllMetrics() {\n            const now = new Date();\n            document.getElementById('last-update').textContent = now.toLocaleTimeString();\n            \n            // Fetch metrics for all nodes\n            await Promise.all([\n                fetchNodeMetrics('master', 'master'),\n                fetchNodeMetrics('worker1', 'worker1'), \n                fetchNodeMetrics('worker2', 'worker2')\n            ]);\n            \n            updateClusterOverview();\n        }\n\n        // Initialize\n        updateCurrentTime();\n        setInterval(updateCurrentTime, 1000);\n        \n        // Initial fetch and setup interval\n        fetchAllMetrics();\n        setInterval(fetchAllMetrics, REFRESH_INTERVAL);\n    \u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"minimal-api-dashboard","namespace":"netdata"}}
    creationTimestamp: "2025-09-01T16:36:06Z"
    name: minimal-api-dashboard
    namespace: netdata
    resourceVersion: "3044597"
    uid: 2bf2dc37-e204-4002-b297-2a6c89d81386
- apiVersion: v1
  data:
    default.conf: |
      server {
          listen 80;

          # CORS headers
          add_header "Access-Control-Allow-Origin" "*" always;
          add_header "Access-Control-Allow-Methods" "GET, OPTIONS" always;
          add_header "Access-Control-Allow-Headers" "Content-Type" always;

          if ($request_method = "OPTIONS") {
              return 204;
          }

          # Serve dashboard at root
          location = / {
              root /usr/share/nginx/html;
              index metrics.html;
              try_files /metrics.html =404;
          }

          # Master node: 192.168.4.100
          location /node/master/cpu {
              proxy_pass http://192.168.4.100:19999/api/v1/data?chart=system.cpu&after=-300&format=json;
              proxy_set_header Host $host;
              proxy_connect_timeout 5s;
              proxy_read_timeout 10s;
          }

          location /node/master/memory {
              proxy_pass http://192.168.4.100:19999/api/v1/data?chart=system.ram&after=-300&format=json;
              proxy_set_header Host $host;
              proxy_connect_timeout 5s;
              proxy_read_timeout 10s;
          }

          location /node/master/load {
              proxy_pass http://192.168.4.100:19999/api/v1/data?chart=system.load&after=-300&format=json;
              proxy_set_header Host $host;
              proxy_connect_timeout 5s;
              proxy_read_timeout 10s;
          }

          location /node/master/uptime {
              proxy_pass http://192.168.4.100:19999/api/v1/data?chart=system.uptime&after=-60&format=json;
              proxy_set_header Host $host;
              proxy_connect_timeout 5s;
              proxy_read_timeout 10s;
          }

          # Worker1 node: 192.168.4.101
          location /node/worker1/cpu {
              proxy_pass http://192.168.4.101:19999/api/v1/data?chart=system.cpu&after=-300&format=json;
              proxy_set_header Host $host;
              proxy_connect_timeout 5s;
              proxy_read_timeout 10s;
          }

          location /node/worker1/memory {
              proxy_pass http://192.168.4.101:19999/api/v1/data?chart=system.ram&after=-300&format=json;
              proxy_set_header Host $host;
              proxy_connect_timeout 5s;
              proxy_read_timeout 10s;
          }

          location /node/worker1/load {
              proxy_pass http://192.168.4.101:19999/api/v1/data?chart=system.load&after=-300&format=json;
              proxy_set_header Host $host;
              proxy_connect_timeout 5s;
              proxy_read_timeout 10s;
          }

          location /node/worker1/uptime {
              proxy_pass http://192.168.4.101:19999/api/v1/data?chart=system.uptime&after=-60&format=json;
              proxy_set_header Host $host;
              proxy_connect_timeout 5s;
              proxy_read_timeout 10s;
          }

          # Worker2 node: 192.168.4.102
          location /node/worker2/cpu {
              proxy_pass http://192.168.4.102:19999/api/v1/data?chart=system.cpu&after=-300&format=json;
              proxy_set_header Host $host;
              proxy_connect_timeout 5s;
              proxy_read_timeout 10s;
          }

          location /node/worker2/memory {
              proxy_pass http://192.168.4.102:19999/api/v1/data?chart=system.ram&after=-300&format=json;
              proxy_set_header Host $host;
              proxy_connect_timeout 5s;
              proxy_read_timeout 10s;
          }

          location /node/worker2/load {
              proxy_pass http://192.168.4.102:19999/api/v1/data?chart=system.load&after=-300&format=json;
              proxy_set_header Host $host;
              proxy_connect_timeout 5s;
              proxy_read_timeout 10s;
          }

          location /node/worker2/uptime {
              proxy_pass http://192.168.4.102:19999/api/v1/data?chart=system.uptime&after=-60&format=json;
              proxy_set_header Host $host;
              proxy_connect_timeout 5s;
              proxy_read_timeout 10s;
          }

          # API endpoints
          location /api/status {
              return 200 '{"status":"healthy","nodes":{"master":"192.168.4.100","worker1":"192.168.4.101","worker2":"192.168.4.102"}}\n';
              add_header Content-Type application/json;
          }

          location /health {
              return 200 '{"status":"healthy"}\n';
              add_header Content-Type application/json;
          }

          location /nodes {
              proxy_pass http://netdata.netdata.svc.cluster.local:19999/api/v1/info;
              proxy_set_header Host $host;
              proxy_connect_timeout 5s;
              proxy_read_timeout 10s;
          }
      }
