/api/v1/data?chart=system.ram\u0026after=-300\u0026format=json;\n        proxy_set_header Host $host;\n        proxy_connect_timeout 5s;\n        proxy_read_timeout 10s;\n    }\n\n    location /node/worker1/load {\n        proxy_pass http://192.168.4.101:19999/api/v1/data?chart=system.load\u0026after=-300\u0026format=json;\n        proxy_set_header Host $host;\n        proxy_connect_timeout 5s;\n        proxy_read_timeout 10s;\n    }\n\n    location /node/worker1/uptime {\n        proxy_pass http://192.168.4.101:19999/api/v1/data?chart=system.uptime\u0026after=-60\u0026format=json;\n        proxy_set_header Host $host;\n        proxy_connect_timeout 5s;\n        proxy_read_timeout 10s;\n    }\n\n    # Worker2 node: 192.168.4.102\n    location /node/worker2/cpu {\n        proxy_pass http://192.168.4.102:19999/api/v1/data?chart=system.cpu\u0026after=-300\u0026format=json;\n        proxy_set_header Host $host;\n        proxy_connect_timeout 5s;\n        proxy_read_timeout 10s;\n    }\n\n    location /node/worker2/memory {\n        proxy_pass http://192.168.4.102:19999/api/v1/data?chart=system.ram\u0026after=-300\u0026format=json;\n        proxy_set_header Host $host;\n        proxy_connect_timeout 5s;\n        proxy_read_timeout 10s;\n    }\n\n    location /node/worker2/load {\n        proxy_pass http://192.168.4.102:19999/api/v1/data?chart=system.load\u0026after=-300\u0026format=json;\n        proxy_set_header Host $host;\n        proxy_connect_timeout 5s;\n        proxy_read_timeout 10s;\n    }\n\n    location /node/worker2/uptime {\n        proxy_pass http://192.168.4.102:19999/api/v1/data?chart=system.uptime\u0026after=-60\u0026format=json;\n        proxy_set_header Host $host;\n        proxy_connect_timeout 5s;\n        proxy_read_timeout 10s;\n    }\n\n    # API endpoints\n    location /api/status {\n        return 200 '{\"status\":\"healthy\",\"nodes\":{\"master\":\"192.168.4.100\",\"worker1\":\"192.168.4.101\",\"worker2\":\"192.168.4.102\"}}\\n';\n        add_header Content-Type application/json;\n    }\n\n    location /health {\n        return 200 '{\"status\":\"healthy\"}\\n';\n        add_header Content-Type application/json;\n    }\n\n    location /nodes {\n        proxy_pass http://netdata.netdata.svc.cluster.local:19999/api/v1/info;\n        proxy_set_header Host $host;\n        proxy_connect_timeout 5s;\n        proxy_read_timeout 10s;\n    }\n}\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"minimal-api-nginx-config","namespace":"netdata"}}
