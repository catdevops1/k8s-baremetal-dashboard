      \   <script>\n        const API_BASE_URL = window.location.origin;\n        const
      REFRESH_INTERVAL = 5000;\n        \n        // Store node data for cluster averages\n
      \       let nodeMetrics = {\n            master: { cpu: 0, memory: 0, load:
      0, online: false },\n            worker1: { cpu: 0, memory: 0, load: 0, online:
      false },\n            worker2: { cpu: 0, memory: 0, load: 0, online: false }\n
      \       };\n\n        function debugLog(message) {\n            console.log(message);\n
      \           document.getElementById('debug-info').textContent = `Debug: ${message}`;\n
      \       }\n\n        function updateCurrentTime() {\n            const now =
      new Date();\n            const timeString = now.toLocaleTimeString();\n            document.getElementById('current-time').textContent
      = timeString;\n        }\n\n        async function fetchNodeMetrics(node, nodeKey)
      {\n            try {\n                debugLog(`Fetching ${node} metrics...`);\n
      \               \n                // Use headers for cache-busting instead of
      URL parameters\n                const requestId = Math.random().toString(36).substring(7);\n
      \               const headers = {\n                    'Cache-Control': 'no-cache,
      no-store, must-revalidate',\n                    'Pragma': 'no-cache',\n                    'Expires':
      '0',\n                    'X-Request-ID': requestId,\n                    'X-Timestamp':
      Date.now().toString()\n                };\n                \n                //
      Fetch metrics for specific node without query parameters  \n                const
      [cpuRes, memRes, loadRes, uptimeRes] = await Promise.all([\n                    fetch(`${API_BASE_URL}/node/${nodeKey}/cpu`,
      {\n                        method: 'GET',\n                        cache: 'no-store',\n
      \                       headers: headers\n                    }),\n                    fetch(`${API_BASE_URL}/node/${nodeKey}/memory`,
      {\n                        method: 'GET', \n                        cache: 'no-store',\n
      \                       headers: headers\n                    }),\n                    fetch(`${API_BASE_URL}/node/${nodeKey}/load`,
      {\n                        method: 'GET',\n                        cache: 'no-store',
      \n                        headers: headers\n                    }),\n                    fetch(`${API_BASE_URL}/node/${nodeKey}/uptime`,
      {\n                        method: 'GET',\n                        cache: 'no-store',\n
      \                       headers: headers\n                    })\n                ]);\n\n
      \               // Check if responses are OK and log status\n                debugLog(`${node}
      responses: CPU=${cpuRes.status}, MEM=${memRes.status}, LOAD=${loadRes.status},
      UP=${uptimeRes.status}`);\n                \n                if (!cpuRes.ok
      || !memRes.ok || !loadRes.ok || !uptimeRes.ok) {\n                    throw
      new Error(`HTTP Error: CPU=${cpuRes.status}, MEM=${memRes.status}, LOAD=${loadRes.status},
      UP=${uptimeRes.status}`);\n                }\n\n                // Get response
      text first to debug what we're receiving\n                const cpuText = await
      cpuRes.text();\n                const memText = await memRes.text();\n                const
      loadText = await loadRes.text();\n                const uptimeText = await uptimeRes.text();\n\n
      \               // Check if response looks like JSON\n                if (!cpuText.startsWith('{')
      && !cpuText.startsWith('[')) {\n                    debugLog(`${node} Error:
      Expected JSON but got: ${cpuText.substring(0, 100)}`);\n                    throw
      new Error(`Invalid JSON response: ${cpuText.substring(0, 100)}`);\n                }\n\n
      \               // Parse JSON\n                const cpuData = JSON.parse(cpuText);\n
      \               const memData = JSON.parse(memText);\n                const
      loadData = JSON.parse(loadText);\n                const uptimeData = JSON.parse(uptimeText);\n\n
      \               // Update status indicator\n                document.getElementById(`${node}-status`).className
      = 'status-indicator status-online';\n                nodeMetrics[node].online
      = true;\n\n                // CPU metrics\n                if (cpuData.data
      && cpuData.data[0]) {\n                    const row = cpuData.data[0];\n                    const
      user = row[6] || 0;\n                    const system = row[7] || 0;\n                    const
      nice = row[8] || 0;\n                    const iowait = row[9] || 0;\n                    const
      totalUsage = user + system + nice + iowait;\n                    \n                    nodeMetrics[node].cpu
      = totalUsage;\n                    document.getElementById(`${node}-cpu-value`).textContent
      = `${totalUsage.toFixed(1)}%`;\n                    document.getElementById(`${node}-cpu-detail`).textContent
      =\n                        `User: ${user.toFixed(1)}%, Sys: ${system.toFixed(1)}%,
      IO: ${iowait.toFixed(1)}%`;\n                }\n\n                // Memory
      metrics\n                if (memData.data && memData.data[0]) {\n                    const
      used = memData.data[0][1] || 0;\n                    const free = memData.data[0][2]
      || 0;\n                    const total = used + free;\n                    const
      usagePercent = ((used / total) * 100);\n                    \n                    nodeMetrics[node].memory
      = usagePercent;\n                    document.getElementById(`${node}-memory-value`).textContent
      = `${usagePercent.toFixed(1)}%`;\n                    document.getElementById(`${node}-memory-detail`).textContent
      = \n                        `${(used/1024).toFixed(1)} GB / ${(total/1024).toFixed(1)}
      GB`;\n                }\n\n                // Load metrics\n                if
      (loadData.data && loadData.data[0]) {\n                    const load1 = loadData.data[0][1]
      || 0;\n                    const load5 = loadData.data[0][2] || 0;\n                    const
      load15 = loadData.data[0][3] || 0;\n                    \n                    nodeMetrics[node].load
      = load1;\n                    document.getElementById(`${node}-load-value`).textContent
      = load1.toFixed(2);\n                    document.getElementById(`${node}-load-detail`).textContent
      = \n                        `${load1.toFixed(2)}, ${load5.toFixed(2)}, ${load15.toFixed(2)}`;\n
      \               }\n\n                // Uptime metrics\n                if (uptimeData.data
      && uptimeData.data[0]) {\n                    const seconds = uptimeData.data[0][1]
      || 0;\n                    const days = Math.floor(seconds / 86400);\n                    const
      hours = Math.floor((seconds % 86400) / 3600);\n                    const minutes
      = Math.floor((seconds % 3600) / 60);\n                    \n                    document.getElementById(`${node}-uptime-value`).textContent
      = `${days}d ${hours}h`;\n                    document.getElementById(`${node}-uptime-detail`).textContent
      = \n                        `${days} days, ${hours} hours, ${minutes} minutes`;\n
      \               }\n\n                debugLog(`${node} metrics updated successfully`);\n\n
      \           } catch (err) {\n                console.error(`Error fetching ${node}
      metrics:`, err);\n                debugLog(`${node} Error: ${err.message}`);\n
      \               \n                document.getElementById(`${node}-status`).className
      = 'status-indicator status-offline';\n                nodeMetrics[node].online
      = false;\n                \n                // Show error state\n                document.getElementById(`${node}-cpu-value`).innerHTML
      = '<span class=\"text-red-400\">Error</span>';\n                document.getElementById(`${node}-memory-value`).innerHTML
      = '<span class=\"text-red-400\">Error</span>';\n                document.getElementById(`${node}-load-value`).innerHTML
      = '<span class=\"text-red-400\">Error</span>';\n            }\n        }\n\n
      \       function updateClusterOverview() {\n            const onlineNodes =
      Object.values(nodeMetrics).filter(n => n.online);\n            const nodeCount
      = onlineNodes.length;\n            \n            if (nodeCount > 0) {\n                const
      avgCpu = onlineNodes.reduce((sum, n) => sum + n.cpu, 0) / nodeCount;\n                const
      avgMemory = onlineNodes.reduce((sum, n) => sum + n.memory, 0) / nodeCount;\n
      \               const avgLoad = onlineNodes.reduce((sum, n) => sum + n.load,
      0) / nodeCount;\n                \n                document.getElementById('cluster-cpu').textContent
      = `${avgCpu.toFixed(1)}%`;\n                document.getElementById('cluster-memory').textContent
      = `${avgMemory.toFixed(1)}%`;\n                document.getElementById('cluster-load').textContent
      = avgLoad.toFixed(2);\n            }\n            \n            document.getElementById('total-nodes').textContent
      = `${nodeCount}/3`;\n            document.getElementById('total-nodes-header').textContent
      = nodeCount;\n        }\n\n        async function fetchAllMetrics() {\n            const
      now = new Date();\n            document.getElementById('last-update').textContent
      = now.toLocaleTimeString();\n            \n            // Fetch metrics for
      all nodes\n            await Promise.all([\n                fetchNodeMetrics('master',
      'master'),\n                fetchNodeMetrics('worker1', 'worker1'), \n                fetchNodeMetrics('worker2',
      'worker2')\n            ]);\n            \n            updateClusterOverview();\n
      \       }\n\n        // Initialize\n        updateCurrentTime();\n        setInterval(updateCurrentTime,
      1000);\n        \n        // Initial fetch and setup interval\n        fetchAllMetrics();\n
      \       setInterval(fetchAllMetrics, REFRESH_INTERVAL);\n    </script>\n</body>\n</html>\n"
