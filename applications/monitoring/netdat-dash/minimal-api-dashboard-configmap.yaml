                    </div>
                    <div class="metric-card bg-gray-800 rounded-lg p-6 shadow-xl">
                        <div class="flex items-center mb-4">
                            <i class="fas fa-clock text-2xl text-purple-400 mr-3"></i>
                            <div class="text-lg font-bold text-gray-300">Uptime</div>
                        </div>
                        <div id="worker1-uptime-value" class="text-3xl font-extrabold text-purple-300 mb-2">--</div>
                        <div id="worker1-uptime-detail" class="text-sm text-gray-400">Loading...</div>
                    </div>
                </div>
            </div>
            <!-- Worker Node 2 -->
            <div class="bg-gradient-to-r from-green-800 to-green-900 rounded-lg p-8 mb-8 shadow-xl">
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-6 text-center">
                    <span class="status-indicator" id="worker2-status"></span>
                    Worker Node 2 (node02)
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="metric-card bg-gray-800 rounded-lg p-6 shadow-xl">
                        <div class="flex items-center mb-4">
                            <i class="fas fa-microchip text-2xl text-green-400 mr-3"></i>
                            <div class="text-lg font-bold text-gray-300">CPU Usage</div>
                        </div>
                        <div id="worker2-cpu-value" class="text-3xl font-extrabold text-green-300 mb-2">--</div>
                        <div id="worker2-cpu-detail" class="text-sm text-gray-400">Loading...</div>
                    </div>
                    <div class="metric-card bg-gray-800 rounded-lg p-6 shadow-xl">
                        <div class="flex items-center mb-4">
                            <i class="fas fa-memory text-2xl text-blue-400 mr-3"></i>
                            <div class="text-lg font-bold text-gray-300">Memory</div>
                        </div>
                        <div id="worker2-memory-value" class="text-3xl font-extrabold text-blue-300 mb-2">--</div>
                        <div id="worker2-memory-detail" class="text-sm text-gray-400">Loading...</div>
                    </div>
                    <div class="metric-card bg-gray-8 rounded-lg p-6 shadow-xl">
                        <div class="flex items-center mb-4">
                            <i class="fas fa-tachometer-alt text-2xl text-orange-400 mr-3"></i>
                            <div class="text-lg font-bold text-gray-300">Load Avg</div>
                        </div>
                        <div id="worker2-load-value" class="text-3xl font-extrabold text-orange-300 mb-2">--</div>
                        <div id="worker2-load-detail" class="text-sm text-gray-400">1m, 5m, 15m</div>
                    </div>
                    <div class="metric-card bg-gray-800 rounded-lg p-6 shadow-xl">
                        <div class="flex items-center mb-4">
                            <i class="fas fa-clock text-2xl text-purple-400 mr-3"></i>
                            <div class="text-lg font-bold text-gray-300">Uptime</div>
                        </div>
                        <div id="worker2-uptime-value" class="text-3xl font-extrabold text-purple-300 mb-2">--</div>
                        <div id="worker2-uptime-detail" class="text-sm text-gray-400">Loading...</div>
                    </div>
                </div>
            </div>
            <!-- Worker Node 3 (NEW) -->
            <div class="bg-gradient-to-r from-yellow-800 to-yellow-900 rounded-lg p-8 mb-8 shadow-xl">
                <h2 class="text-2xl md:text-3xl font-bold text-white mb-6 text-center">
                    <span class="status-indicator" id="worker3-status"></span>
                    Worker Node 3 (node03) - 32GB
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="metric-card bg-gray-800 rounded-lg p-6 shadow-xl">
                        <div class="flex items-center mb-4">
                            <i class="fas fa-microchip text-2xl text-green-400 mr-3"></i>
                            <div class="text-lg font-bold text-gray-300">CPU Usage</div>
                        </div>
                        <div id="worker3-cpu-value" class="text-3xl font-extrabold text-green-300 mb-2">--</div>
                        <div id="worker3-cpu-detail" class="text-sm text-gray-400">Loading...</div>
                    </div>
                    <div class="metric-card bg-gray-800 rounded-lg p-6 shadow-xl">
                        <div class="flex items-center mb-4">
                            <i class="fas fa-memory text-2xl text-blue-400 mr-3"></i>
                            <div class="text-lg font-bold text-gray-300">Memory</div>
                        </div>
                        <div id="worker3-memory-value" class="text-3xl font-extrabold text-blue-300 mb-2">--</div>
                        <div id="worker3-memory-detail" class="text-sm text-gray-400">Loading...</div>
                    </div>
                    <div class="metric-card bg-gray-800 rounded-lg p-6 shadow-xl">
                        <div class="flex items-center mb-4">
                            <i class="fas fa-tachometer-alt text-2xl text-orange-400 mr-3"></i>
                            <div class="text-lg font-bold text-gray-300">Load Avg</div>
                        </div>
                        <div id="worker3-load-value" class="text-3xl font-extrabold text-orange-300 mb-2">--</div>
                        <div id="worker3-load-detail" class="text-sm text-gray-400">1m, 5m, 15m</div>
                    </div>
                    <div class="metric-card bg-gray-800 rounded-lg p-6 shadow-xl">
                        <div class="flex items-center mb-4">
                            <i class="fas fa-clock text-2xl text-purple-400 mr-3"></i>
                            <div class="text-lg font-bold text-gray-300">Uptime</div>
                        </div>
                        <div id="worker3-uptime-value" class="text-3xl font-extrabold text-purple-300 mb-2">--</div>
                        <div id="worker3-uptime-detail" class="text-sm text-gray-400">Loading...</div>
                    </div>
                </div>
            </div>
            <!-- Status Section -->
            <div class="text-center space-y-4">
                <div class="bg-gradient-to-r from-gray-800 to-gray-900 rounded-lg p-6 shadow-xl">
                    <div class="text-lg font-semibold text-white mb-2">
                        <i class="fas fa-sync-alt mr-2"></i>
                        Auto-refreshing every 5 seconds
                    </div>
                    <div class="text-gray-400">
                        Last update: <span id="last-update" class="text-blue-300 font-mono">Never</span>
                    </div>
                </div>
