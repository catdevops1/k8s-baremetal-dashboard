                        <div id="worker1-memory-value" class="text-3xl font-extrabold text-blue-300 mb-2">--</div>
                        <div id="worker1-memory-detail" class="text-sm text-gray-400">Loading...</div>
                    </div>
                    <div class="metric-card bg-gray-800 rounded-lg p-6 shadow-xl">
                        <div class="flex items-center mb-4">
                            <i class="fas fa-tachometer-alt text-2xl text-orange-400 mr-3"></i>
