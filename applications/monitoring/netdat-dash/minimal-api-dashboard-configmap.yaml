            </div>
        </main>
        <!-- Footer -->
        <footer class="bg-gray-800 border-t border-gray-700 py-8 mt-12">
            <div class="container mx-auto px-6">
                <div class="text-center">
                    <div class="flex justify-center space-x-8 mb-4">
                        <a href="https://catdevops.net" class="text-blue-400 hover:text-blue-300 transition-colors">
                            <i class="fas fa-home mr-2"></i>Home
                        </a>
                        <a href="https://github.com/catdevops1/k8s-baremetal-dashboard" target="_blank" class="text-gray-400 hover:text-gray-300 transition-colors">
                            <i class="fab fa-github mr-2"></i>GitHub
                        </a>
                        <a href="https://linkedin.com/in/catalin-bot" target="_blank" class="text-blue-400 hover:text-blue-300 transition-colors">
                            <i class="fab fa-linkedin mr-2"></i>LinkedIn
                        </a>
                    </div>
                    <p class="text-gray-400 text-sm">
                        &copy; 2025 Catalin Bot | Real-time Kubernetes monitoring on bare-metal infrastructure
                    </p>
                </div>
            </div>
        </footer>
        <script>
            const API_BASE_URL = window.location.origin;
            const REFRESH_INTERVAL = 5000;
            
            // Store node data for cluster averages (UPDATED FOR 4 NODES)
            let nodeMetrics = {
                master: { cpu: 0, memory: 0, load: 0, online: false },
                worker1: { cpu: 0, memory: 0, load: 0, online: false },
                worker2: { cpu: 0, memory: 0, load: 0, online: false },
                worker3: { cpu: 0, memory: 0, load: 0, online: false }
            };
            function debugLog(message) {
                console.log(message);
                document.getElementById('debug-info').textContent = `Debug: ${message}`;
            }
            function updateCurrentTime() {
                const now = new Date();
                const timeString = now.toLocaleTimeString();
                document.getElementById('current-time').textContent = timeString;
            }
            async function fetchNodeMetrics(node, nodeKey) {
                try {
                    debugLog(`Fetching ${node} metrics...`);
                    
                    // Use headers for cache-busting instead of URL parameters
                    const requestId = Math.random().toString(36).substring(7);
                    const headers = {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache',
                        'Expires': '0',
                        'X-Request-ID': requestId,
                        'X-Timestamp': Date.now().toString()
                    };
                    
                    // Fetch metrics for specific node without query parameters  
                    const [cpuRes, memRes, loadRes, uptimeRes] = await Promise.all([
                        fetch(`${API_BASE_URL}/node/${nodeKey}/cpu`, {
                            method: 'GET',
                            cache: 'no-store',
                            headers: headers
                        }),
                        fetch(`${API_BASE_URL}/node/${nodeKey}/memory`, {
                            method: 'GET', 
                            cache: 'no-store',
                            headers: headers
                        }),
                        fetch(`${API_BASE_URL}/node/${nodeKey}/load`, {
                            method: 'GET',
                            cache: 'no-store', 
                            headers: headers
                        }),
                        fetch(`${API_BASE_URL}/node/${nodeKey}/uptime`, {
                            method: 'GET',
                            cache: 'no-store',
                            headers: headers
                        })
                    ]);
                    // Check if responses are OK and log status
                    debugLog(`${node} responses: CPU=${cpuRes.status}, MEM=${memRes.status}, LOAD=${loadRes.status}, UP=${uptimeRes.status}`);
                    
                    if (!cpuRes.ok || !memRes.ok || !loadRes.ok || !uptimeRes.ok) {
                        throw new Error(`HTTP Error: CPU=${cpuRes.status}, MEM=${memRes.status}, LOAD=${loadRes.status}, UP=${uptimeRes.status}`);
                    }
                    // Get response text first to debug what we're receiving
                    const cpuText = await cpuRes.text();
                    const memText = await memRes.text();
                    const loadText = await loadRes.text();
                    const uptimeText = await uptimeRes.text();
                    // Check if response looks like JSON
                    if (!cpuText.startsWith('{') && !cpuText.startsWith('[')) {
                        debugLog(`${node} Error: Expected JSON but got: ${cpuText.substring(0, 100)}`);
                        throw new Error(`Invalid JSON response: ${cpuText.substring(0, 100)}`);
                    }
                    // Parse JSON
                    const cpuData = JSON.parse(cpuText);
                    const memData = JSON.parse(memText);
                    const loadData = JSON.parse(loadText);
                    const uptimeData = JSON.parse(uptimeText);
                    // Update status indicator
                    document.getElementById(`${node}-status`).className = 'status-indicator status-online';
                    nodeMetrics[node].online = true;
                    // CPU metrics
                    if (cpuData.data && cpuData.data[0]) {
                        const row = cpuData.data[0];
                        const user = row[6] || 0;
                        const system = row[7] || 0;
                        const nice = row[8] || 0;
                        const iowait = row[9] || 0;
                        const totalUsage = user + system + nice + iowait;
                        
                        nodeMetrics[node].cpu = totalUsage;
                        document.getElementById(`${node}-cpu-value`).textContent = `${totalUsage.toFixed(1)}%`;
                        document.getElementById(`${node}-cpu-detail`).textContent =
                            `User: ${user.toFixed(1)}%, Sys: ${system.toFixed(1)}%, IO: ${iowait.toFixed(1)}%`;
                    }
                    // Memory metrics
                    // Memory metrics - FIXED field assignments
                    if (memData.data && memData.data[0]) {
                    const free = memData.data[0][1] || 0;    // [1] is FREE memory
                    const used = memData.data[0][2] || 0;    // [2] is USED memory  
                    const cached = memData.data[0][3] || 0;  // [3] is CACHED memory
                    const buffers = memData.data[0][4] || 0; // [4] is BUFFERS
    
                    const total = used + free + cached + buffers;
                    const usagePercent = ((used / total) * 100);
                        
                        nodeMetrics[node].memory = usagePercent;
                        document.getElementById(`${node}-memory-value`).textContent = `${usagePercent.toFixed(1)}%`;
                        document.getElementById(`${node}-memory-detail`).textContent = 
                            `${(used/1024).toFixed(1)} GB / ${(total/1024).toFixed(1)} GB`;
                    }
                    // Load metrics
                    if (loadData.data && loadData.data[0]) {
                        const load1 = loadData.data[0][1] || 0;
                        const load5 = loadData.data[0][2] || 0;
                        const load15 = loadData.data[0][3] || 0;
                        
                        nodeMetrics[node].load = load1;
                        document.getElementById(`${node}-load-value`).textContent = load1.toFixed(2);
                        document.getElementById(`${node}-load-detail`).textContent = 
                            `${load1.toFixed(2)}, ${load5.toFixed(2)}, ${load15.toFixed(2)}`;
                    }
                    // Uptime metrics
                    if (uptimeData.data && uptimeData.data[0]) {
                        const seconds = uptimeData.data[0][1] || 0;
                        const days = Math.floor(seconds / 86400);
                        const hours = Math.floor((seconds % 86400) / 3600);
                        const minutes = Math.floor((seconds % 3600) / 60);
                        
                        document.getElementById(`${node}-uptime-value`).textContent = `${days}d ${hours}h`;
                        document.getElementById(`${node}-uptime-detail`).textContent = 
                            `${days} days, ${hours} hours, ${minutes} minutes`;
                    }
                    debugLog(`${node} metrics updated successfully`);
                } catch (err) {
                    console.error(`Error fetching ${node} metrics:`, err);
                    debugLog(`${node} Error: ${err.message}`);
                    
                    document.getElementById(`${node}-status`).className = 'status-indicator status-offline';
                    nodeMetrics[node].online = false;
                    
                    // Show error state
                    document.getElementById(`${node}-cpu-value`).innerHTML = '<span class="text-red-400">Error</span>';
                    document.getElementById(`${node}-memory-value`).innerHTML = '<span class="text-red-400">Error</span>';
                    document.getElementById(`${node}-load-value`).innerHTML = '<span class="text-red-400">Error</span>';
                }
            }
            function updateClusterOverview() {
                const onlineNodes = Object.values(nodeMetrics).filter(n => n.online);
                const nodeCount = onlineNodes.length;
                
                if (nodeCount > 0) {
                    const avgCpu = onlineNodes.reduce((sum, n) => sum + n.cpu, 0) / nodeCount;
                    const avgMemory = onlineNodes.reduce((sum, n) => sum + n.memory, 0) / nodeCount;
                    const avgLoad = onlineNodes.reduce((sum, n) => sum + n.load, 0) / nodeCount;
                    
                    document.getElementById('cluster-cpu').textContent = `${avgCpu.toFixed(1)}%`;
                    document.getElementById('cluster-memory').textContent = `${avgMemory.toFixed(1)}%`;
                    document.getElementById('cluster-load').textContent = avgLoad.toFixed(2);
                }
                
                document.getElementById('total-nodes').textContent = `${nodeCount}/4`;
                document.getElementById('total-nodes-header').textContent = nodeCount;
            }
            async function fetchAllMetrics() {
                const now = new Date();
                document.getElementById('last-update').textContent = now.toLocaleTimeString();
                
                // Fetch metrics for all nodes (UPDATED FOR 4 NODES)
                await Promise.all([
                    fetchNodeMetrics('master', 'master'),
                    fetchNodeMetrics('worker1', 'worker1'), 
                    fetchNodeMetrics('worker2', 'worker2'),
                    fetchNodeMetrics('worker3', 'worker3')
                ]);
                
                updateClusterOverview();
            }
            // Initialize
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
            
            // Initial fetch and setup interval
            fetchAllMetrics();
            setInterval(fetchAllMetrics, REFRESH_INTERVAL);
        </script>
    </body>
    </html>
