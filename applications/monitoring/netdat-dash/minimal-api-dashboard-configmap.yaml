                        <div class="text-gray-400">Usage</div>
                    </div>
                    <div class="metric-card bg-gray-800 rounded-lg p-6 shadow-xl flex flex-col items-center text-center">
                        <div class="text-4xl text-blue-400 mb-4">
                            <i class="fas fa-memory"></i>
                        </div>
                        <div class="text-xl font-bold text-gray-300 mb-2">Avg Memory</div>
                        <div id="cluster-memory" class="text-4xl font-extrabold text-blue-300">--%</div>
                        <div class="text-gray-400">Usage</div>
                    </div>
                    <div class="metric-card bg-gray-800 rounded-lg p-6 shadow-xl flex flex-col items-center text-center">
