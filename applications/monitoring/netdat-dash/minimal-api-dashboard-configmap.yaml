apiVersion: v1
kind: ConfigMap
metadata:
  name: minimal-api-dashboard
  namespace: netdata
data:
  metrics.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CatDevOps.net - Live Cluster Metrics</title>
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
        <style>
            body {
                font-family: 'Inter', sans-serif;
            }
            .gradient-bg {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
            .metric-card {
                transition: all 0.3s ease;
            }
            .metric-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            }
            .animate-pulse-slow {
                animation: pulse 3s infinite;
            }
            .status-indicator {
                display: inline-block;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                margin-right: 8px;
            }
            .status-online {
                background: #10b981;
                box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
            }
            .status-offline {
                background: #ef4444;
                box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
            }
            .debug-info {
                background-color: rgba(0, 0, 0, 0.3);
                border: 1px solid #4a5568;
                border-radius: 8px;
                padding: 12px;
                margin-top: 16px;
                font-family: 'Courier New', monospace;
                font-size: 0.75rem;
                color: #e2e8f0;
            }
        </style>
    </head>
    <body class="bg-gray-900 text-white min-h-screen">
        <!-- Header -->
        <header class="gradient-bg shadow-2xl">
            <div class="container mx-auto px-6 py-8">
                <div class="flex items-center justify-between flex-wrap">
                    <div class="flex items-center space-x-4">
                        <div class="text-3xl md:text-4xl font-extrabold text-white animate-pulse-slow">
                            <i class="fas fa-chart-line mr-2"></i>
                            CatDevOps.net
                        </div>
                        <span class="hidden md:inline-block text-sm text-gray-200">Live Cluster Metrics</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span id="current-time" class="text-sm md:text-base font-medium text-gray-200"></span>
                        <span class="text-lg md:text-xl font-bold text-gray-200">
                            <span id="total-nodes-header">0</span>/4 Nodes Online
                        </span>
                        <a href="https://catdevops.net" class="text-gray-200 hover:text-white transition-colors">
                            <i class="fas fa-home text-xl"></i>
                        </a>
                    </div>
                </div>
            </div>
        </header>
        <!-- Main Content -->
        <main class="container mx-auto px-6 py-12">
            <div class="text-center mb-12">
                <h1 class="text-4xl md:text-5xl font-bold mb-4">
                    Real-Time Cluster Metrics
                </h1>
                <p class="text-gray-400 text-lg">
                    Live monitoring of bare-metal Kubernetes cluster performance
