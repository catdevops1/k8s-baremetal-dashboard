apiVersion: apps/v1
kind: Deployment
metadata:
  name: netdata-minimal-api
  namespace: netdata
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netdata-minimal-api
  template:
    metadata:
      labels:
        app: netdata-minimal-api
    spec:
      serviceAccountName: metrics-api-sa
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: dashboard-html
          mountPath: /usr/share/nginx/html/metrics.html
          subPath: metrics.html
      - name: cluster-info                    # <-- ADD THIS WHOLE CONTAINER
        image: python:3.11-alpine
        command: 
          - /bin/sh
          - -c
          - |
            apk add --no-cache curl && \
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && \
            chmod +x kubectl && \
            mv kubectl /usr/local/bin/ && \
            python3 /scripts/server.py
        volumeMounts:
        - name: script
          mountPath: /scripts
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "50m"      
      volumes:
      - name: nginx-config
        configMap:
          name: minimal-api-nginx-config
      - name: dashboard-html
        configMap:
          name: minimal-api-dashboard
      - name: script                          # <-- ADD THIS VOLUME
        configMap:
          name: cluster-info-script
          defaultMode: 0755      
