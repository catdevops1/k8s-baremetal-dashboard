apiVersion: v1
kind: ConfigMap
metadata:
  name: minimal-api-nginx-config
  namespace: netdata
data:
  default.conf: |
    server {
        listen 80;

        # CORS headers
        add_header "Access-Control-Allow-Origin" "*" always;
        add_header "Access-Control-Allow-Methods" "GET, OPTIONS" always;
        add_header "Access-Control-Allow-Headers" "Content-Type" always;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;

        if ($request_method = "OPTIONS") {
            return 204;
        }

        # Serve dashboard at root
        location = / {
            root /usr/share/nginx/html;
            index metrics.html;
            try_files /metrics.html =404;
        }

        # Master node: 192.168.4.100
        location /node/master/cpu {
            proxy_pass http://192.168.4.100:19999/api/v1/data?chart=system.cpu&after=-300&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /node/master/memory {
            proxy_pass http://192.168.4.100:19999/api/v1/data?chart=system.ram&after=-300&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /node/master/load {
            proxy_pass http://192.168.4.100:19999/api/v1/data?chart=system.load&after=-300&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /node/master/uptime {
            proxy_pass http://192.168.4.100:19999/api/v1/data?chart=system.uptime&after=-60&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Worker1 node: 192.168.4.101
        location /node/worker1/cpu {
            proxy_pass http://192.168.4.101:19999/api/v1/data?chart=system.cpu&after=-300&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /node/worker1/memory {
            proxy_pass http://192.168.4.101:19999/api/v1/data?chart=system.ram&after=-300&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /node/worker1/load {
            proxy_pass http://192.168.4.101:19999/api/v1/data?chart=system.load&after=-300&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /node/worker1/uptime {
            proxy_pass http://192.168.4.101:19999/api/v1/data?chart=system.uptime&after=-60&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Worker2 node: 192.168.4.102
        location /node/worker2/cpu {
            proxy_pass http://192.168.4.102:19999/api/v1/data?chart=system.cpu&after=-300&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /node/worker2/memory {
            proxy_pass http://192.168.4.102:19999/api/v1/data?chart=system.ram&after=-300&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /node/worker2/load {
            proxy_pass http://192.168.4.102:19999/api/v1/data?chart=system.load&after=-300&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /node/worker2/uptime {
            proxy_pass http://192.168.4.102:19999/api/v1/data?chart=system.uptime&after=-60&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Worker3 node: 192.168.4.103 (NEW)
        location /node/worker3/cpu {
            proxy_pass http://192.168.4.103:19999/api/v1/data?chart=system.cpu&after=-300&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /node/worker3/memory {
            proxy_pass http://192.168.4.103:19999/api/v1/data?chart=system.ram&after=-300&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /node/worker3/load {
            proxy_pass http://192.168.4.103:19999/api/v1/data?chart=system.load&after=-300&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /node/worker3/uptime {
            proxy_pass http://192.168.4.103:19999/api/v1/data?chart=system.uptime&after=-60&format=json;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /cluster/info {
            proxy_pass http://127.0.0.1:8081/;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            add_header Content-Type application/json;
        }

        # API endpoints (UPDATED)
        location /api/status {
            return 200 '{"status":"healthy","nodes":{"master":"192.168.4.100","worker1":"192.168.4.101","worker2":"192.168.4.102","worker3":"192.168.4.103"}}\n';
            add_header Content-Type application/json;
        }

        location /health {
            return 200 '{"status":"healthy"}\n';
            add_header Content-Type application/json;
        }

        # location /nodes {
        #    proxy_pass http://netdata.netdata.svc.cluster.local:19999/api/v1/info;
        #   proxy_set_header Host $host;
        #   proxy_connect_timeout 5s;
        #   proxy_read_timeout 10s;
        # }
    }
