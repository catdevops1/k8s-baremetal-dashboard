apiVersion: apps/v1
kind: Deployment
metadata:
  name: netdata-minimal-api
  namespace: netdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netdata-minimal-api
  template:
    metadata:
      labels:
        app: netdata-minimal-api
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: dashboard-html
          mountPath: /usr/share/nginx/html/metrics.html
          subPath: metrics.html
      volumes:
      - name: nginx-config
        configMap:
          name: minimal-api-nginx-config
      - name: dashboard-html
        configMap:
          name: minimal-api-dashboard
