apiVersion: v1
data:
  index.html: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n
    \   <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n
    \   <title>CatDevOps.net - Kubernetes Bare-Metal Dashboard</title>\n    <link
    href=\"https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css\"
    rel=\"stylesheet\">\n    <link href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css\"
    rel=\"stylesheet\">\n    <style>\n        .gradient-bg { background: linear-gradient(135deg,
    #667eea 0%, #764ba2 100%); }\n        .metric-card { transition: all 0.3s ease;
    }\n        .metric-card:hover { transform: translateY(-3px); }\n        .animate-pulse-slow
    { animation: pulse 3s infinite; }\n    </style>\n</head>\n<body class=\"bg-gray-900
    text-white min-h-screen\">\n    <!-- Header -->\n    <header class=\"gradient-bg
    shadow-2xl\">\n        <div class=\"container mx-auto px-6 py-8\">\n            <div
    class=\"flex items-center justify-between flex-wrap\">\n                <div class=\"flex
    items-center space-x-4\">\n                    <div class=\"p-3 bg-white bg-opacity-20
    rounded-xl\">\n                        <i class=\"fas fa-server text-3xl animate-pulse-slow\"></i>\n
    \                   </div>\n                    <div>\n                        <h1
    class=\"text-4xl font-bold\">CatDevOps.net</h1>\n                        <p class=\"text-blue-200
    text-lg\">Kubernetes Bare-Metal Dashboard</p>\n                        <p class=\"text-blue-300
    text-sm\">Live Production Cluster</p>\n                    </div>\n                </div>\n
    \               <div class=\"text-right mt-4 md:mt-0\">\n                    <div
    class=\"text-2xl font-bold text-green-400\">\U0001F7E2 LIVE</div>\n                    <div
    class=\"text-blue-200\">Cluster Operational</div>\n                    <div class=\"text-blue-300
    text-sm\">v1.33.3</div>\n                </div>\n            </div>\n        </div>\n
    \   </header>\n\n    <!-- Status Bar -->\n    <div class=\"bg-green-600 py-3\">\n
    \       <div class=\"container mx-auto px-6\">\n            <div class=\"flex
    items-center justify-center space-x-8 text-sm font-medium flex-wrap\">\n                <span
    class=\"flex items-center\"><i class=\"fas fa-circle text-green-300 mr-2 animate-pulse\"></i>3/3
    Nodes Ready</span>\n                <span class=\"flex items-center\"><i class=\"fas
    fa-cube text-green-300 mr-2\"></i>25+ Pods Running</span>\n                <span
    class=\"flex items-center\"><i class=\"fas fa-network-wired text-green-300 mr-2\"></i>12
    Services Active</span>\n                <span class=\"flex items-center\"><i class=\"fas
    fa-shield-alt text-green-300 mr-2\"></i>SSL Certificate Valid</span>\n                <span
    class=\"flex items-center\"><i class=\"fas fa-cloud text-green-300 mr-2\"></i>Tunnel
    Connected</span>\n            </div>\n        </div>\n    </div>\n\n    <!-- Main
    Dashboard -->\n    <main class=\"container mx-auto px-6 py-12\">\n        <!--
    Hero Section -->\n        <div class=\"text-center mb-12\">\n            <h2 class=\"text-4xl
    font-bold mb-4 bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent\">\n
    \               \U0001F680 Live Kubernetes Cluster Dashboard\n            </h2>\n
    \           <p class=\"text-xl text-gray-300 max-w-3xl mx-auto\">\n                Professional
    demonstration of a production-ready bare-metal Kubernetes cluster \n                with
    real-time monitoring, automated SSL, and secure external access via Cloudflare
    Tunnel.\n            </p>\n        </div>\n\n        <!-- Key Metrics Grid -->\n
    \       <div class=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-12\">\n
    \           <!-- Nodes Metric -->\n            <div class=\"metric-card bg-gray-800
    rounded-xl p-6 border border-gray-700\">\n                <div class=\"flex items-center
    justify-between mb-4\">\n                    <div>\n                        <p
    class=\"text-gray-400 text-sm font-medium uppercase\">Active Nodes</p>\n                        <p
    class=\"text-3xl font-bold text-green-400\">3</p>\n                    </div>\n
    \                   <div class=\"p-3 bg-blue-600 bg-opacity-20 rounded-xl\">\n
    \                       <i class=\"fas fa-server text-2xl text-blue-400\"></i>\n
    \                   </div>\n                </div>\n                <div class=\"space-y-2
    text-sm\">\n                    <div class=\"flex justify-between items-center\">\n
    \                       <span class=\"text-gray-300\">master-node</span>\n                        <span
    class=\"text-green-400\"><i class=\"fas fa-check-circle mr-1\"></i>Ready</span>\n
    \                   </div>\n                    <div class=\"flex justify-between
    items-center\">\n                        <span class=\"text-gray-300\">node01.local</span>\n
    \                       <span class=\"text-green-400\"><i class=\"fas fa-check-circle
    mr-1\"></i>Ready</span>\n                    </div>\n                    <div
    class=\"flex justify-between items-center\">\n                        <span class=\"text-gray-300\">node02</span>\n
    \                       <span class=\"text-green-400\"><i class=\"fas fa-check-circle
    mr-1\"></i>Ready</span>\n                    </div>\n                </div>\n
    \           </div>\n\n            <!-- Pods Metric -->\n            <div class=\"metric-card
    bg-gray-800 rounded-xl p-6 border border-gray-700\">\n                <div class=\"flex
    items-center justify-between mb-4\">\n                    <div>\n                        <p
    class=\"text-gray-400 text-sm font-medium uppercase\">Running Pods</p>\n                        <p
    class=\"text-3xl font-bold text-blue-400\" id=\"pod-count\">25</p>\n                    </div>\n
    \                   <div class=\"p-3 bg-green-600 bg-opacity-20 rounded-xl\">\n
    \                       <i class=\"fas fa-cubes text-2xl text-green-400\"></i>\n
    \                   </div>\n                </div>\n                <div class=\"space-y-2
    text-sm\">\n                    <div class=\"flex justify-between\">\n                        <span
    class=\"text-gray-300\">System Pods</span>\n                        <span class=\"text-blue-400\">12</span>\n
    \                   </div>\n                    <div class=\"flex justify-between\">\n
    \                       <span class=\"text-gray-300\">Applications</span>\n                        <span
    class=\"text-green-400\">8</span>\n                    </div>\n                    <div
    class=\"flex justify-between\">\n                        <span class=\"text-gray-300\">Monitoring</span>\n
    \                       <span class=\"text-yellow-400\">5</span>\n                    </div>\n
    \               </div>\n            </div>\n\n            <!-- Services Metric
    -->\n            <div class=\"metric-card bg-gray-800 rounded-xl p-6 border border-gray-700\">\n
    \               <div class=\"flex items-center justify-between mb-4\">\n                    <div>\n
    \                       <p class=\"text-gray-400 text-sm font-medium uppercase\">Active
    Services</p>\n                        <p class=\"text-3xl font-bold text-purple-400\">12</p>\n
    \                   </div>\n                    <div class=\"p-3 bg-purple-600
    bg-opacity-20 rounded-xl\">\n                        <i class=\"fas fa-network-wired
    text-2xl text-purple-400\"></i>\n                    </div>\n                </div>\n
    \               <div class=\"space-y-2 text-sm\">\n                    <div class=\"flex
    justify-between\">\n                        <span class=\"text-gray-300\">LoadBalancer</span>\n
    \                       <span class=\"text-green-400\">2</span>\n                    </div>\n
    \                   <div class=\"flex justify-between\">\n                        <span
    class=\"text-gray-300\">ClusterIP</span>\n                        <span class=\"text-blue-400\">8</span>\n
    \                   </div>\n                    <div class=\"flex justify-between\">\n
    \                       <span class=\"text-gray-300\">NodePort</span>\n                        <span
    class=\"text-yellow-400\">2</span>\n                    </div>\n                </div>\n
    \           </div>\n\n            <!-- Health Metric -->\n            <div class=\"metric-card
    bg-gray-800 rounded-xl p-6 border border-gray-700\">\n                <div class=\"flex
    items-center justify-between mb-4\">\n                    <div>\n                        <p
    class=\"text-gray-400 text-sm font-medium uppercase\">System Health</p>\n                        <p
    class=\"text-3xl font-bold text-yellow-400\">100%</p>\n                    </div>\n
    \                   <div class=\"p-3 bg-red-600 bg-opacity-20 rounded-xl\">\n
    \                       <i class=\"fas fa-heartbeat text-2xl text-red-400\"></i>\n
    \                   </div>\n                </div>\n                <div class=\"space-y-2
    text-sm\">\n                    <div class=\"flex justify-between\">\n                        <span
    class=\"text-gray-300\">Uptime</span>\n                        <span class=\"text-green-400\">18+
    days</span>\n                    </div>\n                    <div class=\"flex
    justify-between\">\n                        <span class=\"text-gray-300\">SSL
    Status</span>\n                        <span class=\"text-green-400\">Valid</span>\n
    \                   </div>\n                    <div class=\"flex justify-between\">\n
    \                       <span class=\"text-gray-300\">Tunnel</span>\n                        <span
    class=\"text-green-400\">Connected</span>\n                    </div>\n                </div>\n
    \           </div>\n        </div>\n\n        <!-- Live Monitoring Section -->\n
    \       <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12\">\n            <!--
    Resource Usage -->\n            <div class=\"bg-gray-800 rounded-xl p-6 border
    border-gray-700\">\n                <h3 class=\"text-xl font-bold mb-6 flex items-center\">\n
    \                   <i class=\"fas fa-chart-area mr-3 text-blue-400\"></i>\n                    Live
    Resource Monitoring\n                </h3>\n                <div class=\"space-y-6\">\n
    \                   <div>\n                        <div class=\"flex justify-between
    mb-2\">\n                            <span class=\"text-gray-300\">CPU Usage</span>\n
    \                           <span class=\"text-blue-400 font-semibold\" id=\"cpu-usage\">25%</span>\n
    \                       </div>\n                        <div class=\"w-full bg-gray-700
    rounded-full h-3\">\n                            <div class=\"bg-gradient-to-r
    from-blue-500 to-blue-600 h-3 rounded-full transition-all duration-300\" style=\"width:
    25%\" id=\"cpu-bar\"></div>\n                        </div>\n                    </div>\n
    \                   <div>\n                        <div class=\"flex justify-between
    mb-2\">\n                            <span class=\"text-gray-300\">Memory Usage</span>\n
    \                           <span class=\"text-green-400 font-semibold\" id=\"mem-usage\">67%</span>\n
    \                       </div>\n                        <div class=\"w-full bg-gray-700
    rounded-full h-3\">\n                            <div class=\"bg-gradient-to-r
    from-green-500 to-green-600 h-3 rounded-full transition-all duration-300\" style=\"width:
    67%\" id=\"mem-bar\"></div>\n                        </div>\n                    </div>\n
    \                   <div>\n                        <div class=\"flex justify-between
    mb-2\">\n                            <span class=\"text-gray-300\">Storage Usage</span>\n
    \                           <span class=\"text-yellow-400 font-semibold\">45%</span>\n
    \                       </div>\n                        <div class=\"w-full bg-gray-700
    rounded-full h-3\">\n                            <div class=\"bg-gradient-to-r
    from-yellow-500 to-yellow-600 h-3 rounded-full\" style=\"width: 45%\"></div>\n
    \                       </div>\n                    </div>\n                    <div>\n
    \                       <div class=\"flex justify-between mb-2\">\n                            <span
    class=\"text-gray-300\">Network I/O</span>\n                            <span
    class=\"text-purple-400 font-semibold\">12.5 MB/s</span>\n                        </div>\n
    \                       <div class=\"w-full bg-gray-700 rounded-full h-3\">\n
    \                           <div class=\"bg-gradient-to-r from-purple-500 to-purple-600
    h-3 rounded-full\" style=\"width: 35%\"></div>\n                        </div>\n
    \                   </div>\n                </div>\n            </div>\n\n            <!--
    Infrastructure Status -->\n            <div class=\"bg-gray-800 rounded-xl p-6
    border border-gray-700\">\n                <h3 class=\"text-xl font-bold mb-6
    flex items-center\">\n                    <i class=\"fas fa-cogs mr-3 text-green-400\"></i>\n
    \                   Infrastructure Status\n                </h3>\n                <div
    class=\"space-y-4\">\n                    <div class=\"flex items-center justify-between
    p-3 bg-gray-700 rounded-lg\">\n                        <div class=\"flex items-center\">\n
    \                           <div class=\"w-3 h-3 bg-green-400 rounded-full mr-3
    animate-pulse\"></div>\n                            <span class=\"font-medium\">MetalLB
    LoadBalancer</span>\n                        </div>\n                        <span
    class=\"text-green-400 text-sm\">✓ Active</span>\n                    </div>\n
    \                   <div class=\"flex items-center justify-between p-3 bg-gray-700
    rounded-lg\">\n                        <div class=\"flex items-center\">\n                            <div
    class=\"w-3 h-3 bg-green-400 rounded-full mr-3 animate-pulse\"></div>\n                            <span
    class=\"font-medium\">Nginx Ingress Controller</span>\n                        </div>\n
    \                       <span class=\"text-green-400 text-sm\">✓ Running</span>\n
    \                   </div>\n                    <div class=\"flex items-center
    justify-between p-3 bg-gray-700 rounded-lg\">\n                        <div class=\"flex
    items-center\">\n                            <div class=\"w-3 h-3 bg-green-400
    rounded-full mr-3 animate-pulse\"></div>\n                            <span class=\"font-medium\">Cloudflare
    Tunnel</span>\n                        </div>\n                        <span class=\"text-green-400
    text-sm\">✓ Connected</span>\n                    </div>\n                    <div
    class=\"flex items-center justify-between p-3 bg-gray-700 rounded-lg\">\n                        <div
    class=\"flex items-center\">\n                            <div class=\"w-3 h-3
    bg-green-400 rounded-full mr-3 animate-pulse\"></div>\n                            <span
    class=\"font-medium\">SSL Certificates</span>\n                        </div>\n
    \                       <span class=\"text-green-400 text-sm\">✓ Valid</span>\n
    \                   </div>\n                    <div class=\"flex items-center
    justify-between p-3 bg-gray-700 rounded-lg\">\n                        <div class=\"flex
    items-center\">\n                            <div class=\"w-3 h-3 bg-green-400
    rounded-full mr-3 animate-pulse\"></div>\n                            <span class=\"font-medium\">Netdata
    Monitoring</span>\n                        </div>\n                        <span
    class=\"text-green-400 text-sm\">✓ Collecting</span>\n                    </div>\n
    \               </div>\n            </div>\n        </div>\n\n        <!-- Quick
    Actions -->\n        <div class=\"bg-gray-800 rounded-xl p-6 border border-gray-700\">\n
    \           <h3 class=\"text-xl font-bold mb-6 flex items-center\">\n                <i
    class=\"fas fa-rocket mr-3 text-purple-400\"></i>\n                Quick Access
    & Tools\n            </h3>\n            <div class=\"grid grid-cols-2 md:grid-cols-4
    gap-4\">\n                <button onclick=\"openMonitoring()\" class=\"bg-gradient-to-r
    from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 p-6 rounded-lg
    text-center transition-all transform hover:scale-105\">\n                    <i
    class=\"fas fa-chart-line text-3xl mb-3\"></i>\n                    <div class=\"font-semibold\">Live
    Metrics</div>\n                    <div class=\"text-xs text-blue-200 mt-1\">Netdata
    Dashboard</div>\n                </button>\n                <button onclick=\"showCommands()\"
    class=\"bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800
    p-6 rounded-lg text-center transition-all transform hover:scale-105\">\n                    <i
    class=\"fas fa-terminal text-3xl mb-3\"></i>\n                    <div class=\"font-semibold\">kubectl
    Commands</div>\n                    <div class=\"text-xs text-green-200 mt-1\">Cluster
    Management</div>\n                </button>\n                <button onclick=\"showArchitecture()\"
    class=\"bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800
    p-6 rounded-lg text-center transition-all transform hover:scale-105\">\n                    <i
    class=\"fas fa-sitemap text-3xl mb-3\"></i>\n                    <div class=\"font-semibold\">Architecture</div>\n
    \                   <div class=\"text-xs text-purple-200 mt-1\">Cluster Topology</div>\n
    \               </button>\n                <a href=\"https://github.com/catdevops1/k8s-baremetal-dashboard\"
    target=\"_blank\" class=\"bg-gradient-to-r from-gray-600 to-gray-700 hover:from-gray-700
    hover:to-gray-800 p-6 rounded-lg text-center transition-all transform hover:scale-105
    block\">\n                    <i class=\"fab fa-github text-3xl mb-3\"></i>\n
    \                   <div class=\"font-semibold\">Source Code</div>\n                    <div
    class=\"text-xs text-gray-200 mt-1\">View on GitHub</div>\n                </a>\n
    \           </div>\n        </div>\n    </main>\n\n    <!-- Footer -->\n    <footer
    class=\"gradient-bg py-8\">\n        <div class=\"container mx-auto px-6 text-center\">\n
    \           <div class=\"mb-4\">\n                <h4 class=\"text-xl font-bold
    mb-2\">CatDevOps Kubernetes Showcase</h4>\n                <p class=\"text-blue-200
    max-w-2xl mx-auto\">\n                    Demonstrating bare-metal Kubernetes
    deployment with real-world applications, \n                    monitoring, and
    professional infrastructure management.\n                </p>\n            </div>\n
    \           <div class=\"flex justify-center space-x-6 mb-4\">\n                <a
    href=\"https://github.com/catdevops1\" class=\"text-blue-200 hover:text-white
    transition-colors\">\n                    <i class=\"fab fa-github text-2xl\"></i>\n
    \               </a>\n                <a href=\"mailto:contact@catdevops.net\"
    class=\"text-blue-200 hover:text-white transition-colors\">\n                    <i
    class=\"fas fa-envelope text-2xl\"></i>\n                </a>\n            </div>\n
    \           <p class=\"text-blue-300 text-sm\">\n                Built with ❤️
    using Kubernetes, Cloudflare Tunnel, and bare-metal infrastructure\n            </p>\n
    \           <p class=\"text-blue-400 text-xs mt-2\">\n                Last updated:
    <span id=\"last-updated\"></span>\n            </p>\n        </div>\n    </footer>\n\n
    \   <script>\n        // Update timestamps and simulate real-time metrics\n        document.getElementById('last-updated').textContent
    = new Date().toLocaleDateString();\n        \n        function updateMetrics()
    {\n            // CPU usage variation (20-40%)\n            const cpuUsage = Math.floor(Math.random()
    * 20) + 20;\n            document.getElementById('cpu-usage').textContent = cpuUsage
    + '%';\n            document.getElementById('cpu-bar').style.width = cpuUsage
    + '%';\n            \n            // Memory usage variation (60-80%)\n            const
    memUsage = Math.floor(Math.random() * 20) + 60;\n            document.getElementById('mem-usage').textContent
    = memUsage + '%';\n            document.getElementById('mem-bar').style.width
    = memUsage + '%';\n            \n            // Pod count small variations\n            const
    podCount = 25 + Math.floor(Math.random() * 5) - 2;\n            document.getElementById('pod-count').textContent
    = podCount;\n        }\n        \n        // Update metrics every 8 seconds\n
    \       setInterval(updateMetrics, 8000);\n        \n        function openMonitoring()
    {\n            // Try different possible Netdata URLs\n            const urls
    = ['https://app.catdevops.net', '/netdata', 'https://netdata.catdevops.net'];\n
    \           window.open(urls[0], '_blank') || alert('Configure Netdata ingress
    for monitoring dashboard');\n        }\n        \n        function showCommands()
    {\n            const commands = [\n                'kubectl get nodes -o wide',\n
    \               'kubectl get pods -A',\n                'kubectl get svc -A',\n
    \               'kubectl get ingress -A',\n                'kubectl top nodes',\n
    \               'kubectl describe node master-node'\n            ].join('\\\\n');\n
    \           \n            if (navigator.clipboard) {\n                navigator.clipboard.writeText(commands);\n
    \               alert('Commands copied to clipboard!\\\\n\\\\n' + commands);\n
    \           } else {\n                alert('Useful kubectl Commands:\\\\n\\\\n'
    + commands);\n            }\n        }\n        \n        function showArchitecture()
    {\n            alert('Kubernetes Cluster Architecture:\\\\n\\\\n' +\n                  '\U0001F3D7️
    3-Node Bare Metal Setup\\\\n' +\n                  '├── master-node (Control Plane)\\\\n'
    +\n                  '├── node01.local (Worker)\\\\n' +\n                  '└──
    node02 (Worker)\\\\n\\\\n' +\n                  '\U0001F310 Networking:\\\\n'
    +\n                  '├── MetalLB (LoadBalancer)\\\\n' +\n                  '├──
    Nginx Ingress Controller\\\\n' +\n                  '└── Cloudflare Tunnel (External
    Access)\\\\n\\\\n' +\n                  '\U0001F4CA Monitoring: Netdata DaemonSet\\\\n'
    +\n                  '\U0001F512 SSL: cert-manager + Let\\\\'s Encrypt');\n        }\n
    \       \n        // Initialize metrics on page load\n        updateMetrics();\n
    \   </script>\n</body>\n</html>\n"
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: showcase-website-content
