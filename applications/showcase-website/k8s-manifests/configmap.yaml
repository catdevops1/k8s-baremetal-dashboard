        <script>
            const METRICS_API = 'https://metrics.catdevops.net';
            const NODES = ['master', 'worker1', 'worker2', 'worker3'];

            function showModal(title, message) {
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-message').innerHTML = '<pre>' + message + '</pre>';
                document.getElementById('modal-overlay').style.display = 'flex';
            }

            function closeModal() {
                document.getElementById('modal-overlay').style.display = 'none';
            }

            function showApplications() {
                document.getElementById('applications-modal').style.display = 'flex';
            }

            function closeApplicationsModal() {
                document.getElementById('applications-modal').style.display = 'none';
            }

            function showProjects() {
                document.getElementById('projects-modal').style.display = 'flex';
            }

            function closeProjectsModal() {
                document.getElementById('projects-modal').style.display = 'none';
            }

            async function fetchNode(nodeKey) {
                try {
                    const [cpuRes, memRes] = await Promise.all([
                        fetch(METRICS_API + '/node/' + nodeKey + '/cpu', { cache: 'no-store' }),
                        fetch(METRICS_API + '/node/' + nodeKey + '/memory', { cache: 'no-store' })
                    ]);
                    if (!cpuRes.ok || !memRes.ok) return null;

                    const cpuData = await cpuRes.json();
                    const memData = await memRes.json();
                    if (!cpuData.data || !cpuData.data[0]) return null;
                    if (!memData.data || !memData.data[0]) return null;

                    const c = cpuData.data[0];
                    const cpu = (c[6] || 0) + (c[7] || 0) + (c[8] || 0) + (c[9] || 0);

                    const m = memData.data[0];
                    const free = m[1] || 0;
                    const used = m[2] || 0;
                    const cached = m[3] || 0;
                    const buffers = m[4] || 0;
                    const total = free + used + cached + buffers;
                    const memPct = total ? (used / total) * 100 : 0;

                    return { cpu: cpu, memPct: memPct };
                } catch (err) {
                    console.error('Error fetching ' + nodeKey + ':', err);
                    return null;
                }
            }

            async function updateMetrics() {
                const results = (await Promise.all(NODES.map(fetchNode))).filter(function(r) { return r !== null; });

                if (results.length) {
                    const avgCpu = results.reduce(function(s, n) { return s + n.cpu; }, 0) / results.length;
                    const avgMem = results.reduce(function(s, n) { return s + n.memPct; }, 0) / results.length;
                    document.getElementById('cpu-usage').textContent = avgCpu.toFixed(1) + '%';
                    document.getElementById('memory-usage').textContent = avgMem.toFixed(1) + '%';
                } else {
                    document.getElementById('cpu-usage').textContent = 'N/A';
                    document.getElementById('memory-usage').textContent = 'N/A';
                }

                try {
                    const res = await fetch(METRICS_API + '/cluster/info', { cache: 'no-store' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    const pods = (data.cluster && data.cluster.pods) ? data.cluster.pods.running : null;
                    const age = (data.cluster && data.cluster.ageDays !== undefined) ? data.cluster.ageDays : null;
                    document.getElementById('pods-running').textContent = pods !== null ? pods : 'N/A';
                    document.getElementById('ingresses').textContent = age !== null ? age : 'N/A';
                } catch (err) {
                    console.error('Error fetching cluster info:', err);
                    document.getElementById('pods-running').textContent = 'N/A';
                    document.getElementById('ingresses').textContent = 'N/A';
                }

                document.getElementById('current-time').textContent =
                    'Last updated: ' + new Date().toLocaleTimeString();
            }

            function showCommands() {
                const commands = 'kubectl get po -A\nkubectl get svc -A\nkubectl get ingress -A\nkubectl top nodes\nkubectl describe node master-node';

                if (navigator.clipboard) {
                    navigator.clipboard.writeText(commands).then(function() {
                        showModal('Commands Copied to Clipboard!', commands);
                    }).catch(function(err) {
                        showModal('Clipboard Error', 'Failed to copy commands. Please copy them manually.');
                        console.error('Could not copy text: ', err);
                    });
                } else {
                    showModal('Useful kubectl Commands', commands);
                }
            }

            function showArchitecture() {
                const architecture = 'Kubernetes Cluster Architecture:\n' +
                                     '🗄️ 4-Node Bare Metal Setup\n' +
                                     '├── master-node (Control Plane)\n' +
                                     '├── node01.local (Worker)\n' +
                                     '├── node02 (Worker)\n' +
                                     '└── node03 (Worker)\n' +
                                     '\n' +
                                     '🌐 Networking:\n' +
                                     '├── MetalLB (LoadBalancer)\n' +
                                     '├── Envoy Gateway (Gateway API)\n' +
                                     '├── Cloudflare Tunnel (External Access)\n' +
                                     '└── Flannel CNI (Pod Network)\n' +
                                     '\n' +
                                     '💾 Storage:\n' +
                                     '└── Longhorn (Distributed Block Storage)\n' +
                                     '\n' +
                                     '📊 Monitoring & Observability:\n' +
                                     '├── Netdata (Real-time Metrics)\n' +
                                     '└── Custom Metrics API (metrics.catdevops.net)\n' +
                                     '\n' +
                                     '🔒 Security & TLS:\n' +
                                     '└── cert-manager + Let\'s Encrypt\n' +
                                     '\n' +
                                     '🚀 GitOps & Deployment:\n' +
                                     '├── ArgoCD (Continuous Deployment)\n' +
                                     '└── GitHub Actions (CI Pipeline)\n' +
                                     '\n' +
                                     '📦 Container Runtime:\n' +
                                     '└── containerd';
                document.getElementById('modal-title').textContent = 'Kubernetes Cluster Architecture';
                document.getElementById('modal-message').innerHTML = '<pre>' + architecture + '</pre>' +
                    '<div style="text-align: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid #4a5568;">' +
                    '<a href="https://raw.githubusercontent.com/catdevops1/k8s-baremetal-dashboard/main/docs/screenshots/k8s-illustration3.webp" ' +
                    'target="_blank" rel="noopener" ' +
                    'style="color: #63b3ed; text-decoration: none; font-size: 0.95rem;">' +
                    '<i class="fas fa-image" style="margin-right: 8px;"></i>' +
                    'View Full Visual Architecture →</a></div>';
                document.getElementById('modal-overlay').style.display = 'flex';
            }

            window.onload = function() {
                updateMetrics();
                setInterval(updateMetrics, 30000);
            };
        </script>
