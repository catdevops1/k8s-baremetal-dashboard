apiVersion: apps/v1
kind: Deployment
metadata:
  name: showcase-website
  labels:
    app: showcase-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: showcase-website
  template:
    metadata:
      labels:
        app: showcase-website
    spec:
      containers:
      - name: website
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: website-content
        configMap:
          name: showcase-website-content
